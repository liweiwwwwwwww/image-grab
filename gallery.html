<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图提取 · 图片画廊</title>
  <link rel="stylesheet" href="gallery.css" />
</head>
<body>
  <header class="toolbar">
    <h1>图提取 · ImageGrab</h1>
    <div class="actions">
      <button id="select-all" class="btn">全选</button>
      <button id="select-none" class="btn">反选</button>
      <span id="count" class="count">已选 0 张</span>
      <button id="download" class="btn primary">下载选中</button>
    </div>
    <div id="progress" class="progress" hidden></div>
  </header>

  <main id="grid" class="grid"></main>

  <div id="empty" class="empty" hidden>没有提取到图片</div>

  <script src="gallery.js"></script>
</body>
</html>
